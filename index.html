      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;

    /* Glassmorphism Utilities */
    .glass-panel {
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);

    .glass-pill {
      background: rgba(30, 41, 59, 0.78);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);

      border-color: rgba(129, 140, 248, 0.6);

    }

      background: rgba(15, 23, 42, 0.4);
    }

      background: rgba(99, 102, 241, 0.5);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(99, 102, 241, 0.8);
    }

    /* Floating 3D Island Pin Labels */
    .island-label {

      transform: translate(-50%, -100%);
      pointer-events: auto;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
      z-index: 10;

      50% { transform: scale(1.12); opacity: 0.35; }
      100% { transform: scale(0.9); opacity: 0.8; }
    }
    .animate-pulse-slow {
      animation: pulse-ring 3s infinite ease-in-out;

  <script>
    /********************************************************************
     * 1. COURSE CURRICULUM DATA (All 9 Islands / Units 1-1 to 9-2)
     ********************************************************************/
    const ISLANDS_DATA = [
      {
        id: 1,
        name: "協作與倫理之島",
        book: "第一冊",
        unitRange: "單元 1-1 & 1-2",
        shortTitle: "1. 協作與倫理",
        color: "#06b6d4", // Cyan
        accentClass: "from-cyan-500 to-blue-600",
        icon: "fa-robot",
        position: { x: -38, y: 0, z: 26 },
        labType: "prompt",
        subUnits: [
          {
            code: "單元 1-1",
            title: "AIGC 乘上視覺設計：角色、步驟與基礎應用",
            coreEssence: "從隨機生成到精準協作：AIGC 是隨時待命的「設計助理」，負責加速嘗試；人類負責判斷、選擇與完成。",
            memoryHook: "AI 幫你加速發想與起草，人負責最後的美學選擇與邏輯把關！",
            flashcards: [
              {
                tag: "01 角色定位",
                title: "AIGC 在視覺設計扮演什麼角色？",
                points: [
                  "AIGC 是利用 AI 生成內容的工具，猶如「設計助理」。",
                  "協助發想、摘要、圖像生成、版面建議與風格探索。",
                  "核心價值是加快嘗試與修正速度，而非取代設計者。"
                ]
              },
              {
                tag: "02 介入流程",
                title: "前、中、後三階段介入路徑",
                points: [
                  "【前期】蒐集靈感、釐清主題、了解不同受眾語氣（學生/老師/家長）。",
                  "【中期】摘要長篇資料、生成構圖草案、探索極簡/手繪/科技等風格。",
                  "【後期】提供海報或簡報版面建議、優化文案、快速微調修正。"
                ]
              },
              {
                tag: "03 提示詞公式",
                title: "寫出好提示詞（Prompt）的五大要素",
                points: [
                  "1. 目的（想達成什麼效果？）＋ 2. 對象（給誰看？）",
                  "3. 風格（什麼畫面感？）＋ 4. 限制（字數、色彩或禁忌）",
                  "5. 格式（海報、圖卡或簡報），並以「請列出 5 種方案」擴展多樣性。"
                ]
              }
            ]
          },
          {
            code: "單元 1-2",
            title: "建立 AI 使用規範：版權、查核與隱私安全",
            coreEssence: "先想「能不能用、該不該用、要不要標示」，建立保護權利、查證幻覺與誠實揭露的負責任態度。",
            memoryHook: "先查、再用、後修正！越重要的資訊越要交叉查證，誠實標示更專業。",
            flashcards: [
              {
                tag: "01 著作權與隱私",
                title: "版權合規與個資保護紅線",
                points: [
                  "檢查 AI 生成內容的授權條款，商用前務必再次確認使用條件。",
                  "不擅自複製或模仿他人受保護的角色與畫風。",
                  "不輸入學號、住址、病歷等敏感個資；上傳他人照片前須取得同意，或先匿名化處理。"
                ]
              },
              {
                tag: "02 真實性查核",
                title: "對抗 AI「幻覺（Hallucination）」",
                points: [
                  "AI 可能捏造看似合理的假資訊或假引用。",
                  "重要資訊至少交叉查證「兩個以上」獨立且可靠的來源。",
                  "優先查核政府官方、學術機構或原始出處資料；特別核對日期、數據與專有名詞。"
                ]
              },
              {
                tag: "03 揭露與四步驟",
                title: "AI 使用四步驟與透明揭露",
                points: [

    function initThreeScene() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();

      const pointLightCenter = new THREE.PointLight(0x818cf8, 1.5, 90);
      pointLightCenter.position.set(0, 20, 0);

    function createStylizedOcean() {
      const geo = new THREE.PlaneGeometry(320, 320, 48, 48);
      geo.rotateX(-Math.PI / 2);

      // Store original vertices for wave animation
      const posAttr = geo.attributes.position;
      const baseHeights = [];
      for (let i = 0; i < posAttr.count; i++) {
        baseHeights.push(posAttr.getY(i));
      }
      geo.userData.baseHeights = baseHeights;

      const mat = new THREE.MeshStandardMaterial({
        color: 0x0b1528,
        emissive: 0x091936,
        emissiveIntensity: 0.4,
        roughness: 0.25,
        metalness: 0.6,
        wireframe: false,
        flatShading: true
      });

      oceanMesh = new THREE.Mesh(geo, mat);
      oceanMesh.position.y = -4.5;
      oceanMesh.receiveShadow = true;
      scene.add(oceanMesh);

      // Subtle glowing polar grid on the water surface
      const gridHelper = new THREE.PolarGridHelper(110, 16, 8, 64, 0x1e3a8a, 0x1e293b);
      gridHelper.position.y = -4.1;
      scene.add(gridHelper);
    }

    function createDataParticles() {
      const count = 260;
      const geo = new THREE.BufferGeometry();
      const positions = new Float32Array(count * 3);
      for (let i = 0; i < count; i++) {
        positions[i * 3] = (Math.random() - 0.5) * 160;
        positions[i * 3 + 1] = Math.random() * 45 - 2;
        positions[i * 3 + 2] = (Math.random() - 0.5) * 160;
      }
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const mat = new THREE.PointsMaterial({
        color: 0x67e8f9,
        size: 0.65,
        transparent: true,
        opacity: 0.65
      });
      particleSystem = new THREE.Points(geo, mat);
      scene.add(particleSystem);
    }

    function buildArchipelagoIslands() {
      ISLANDS_DATA.forEach((isl) => {
        const group = new THREE.Group();
        group.position.set(isl.position.x, isl.position.y, isl.position.z);
        group.userData = { islandId: isl.id };

        const themeColor = new THREE.Color(isl.color);

        // 1. Stylized Low-Poly Floating Rock Base (Inverted Cone + Cylinder Platform)
        const rockGeo = new THREE.ConeGeometry(6.8, 6.5, 7);
        rockGeo.rotateX(Math.PI);
        const rockMat = new THREE.MeshStandardMaterial({
          color: 0x1e293b,
          roughness: 0.8,
          flatShading: true
        });
        const rockMesh = new THREE.Mesh(rockGeo, rockMat);
        rockMesh.position.y = -3.2;
        rockMesh.castShadow = true;
        group.add(rockMesh);

        // Top Turf Platform
        const topGeo = new THREE.CylinderGeometry(7.2, 6.6, 1.4, 7);
        const topMat = new THREE.MeshStandardMaterial({
          color: 0x0f172a,
          emissive: themeColor,
          emissiveIntensity: 0.22,
          roughness: 0.4,
          flatShading: true
        });
        const topMesh = new THREE.Mesh(topGeo, topMat);
        topMesh.position.y = 0.2;
        topMesh.receiveShadow = true;
        topMesh.userData = { islandId: isl.id };
        group.add(topMesh);
        islandMeshes.push(topMesh);

        // Glowing Ring around Island Base
        const ringGeo = new THREE.RingGeometry(7.5, 8.1, 32);
        ringGeo.rotateX(-Math.PI / 2);
        const ringMat = new THREE.MeshBasicMaterial({
          color: themeColor,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.55
        });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
        ringMesh.position.y = 0.3;
        group.add(ringMesh);
        group.userData.ringMesh = ringMesh;

        // 2. Thematic 3D Monument per Island
        const monumentGroup = createIslandMonument(isl.id, themeColor);
        monumentGroup.position.y = 1.2;
        // Make monument clickable too
        monumentGroup.traverse((child) => {
          if (child.isMesh) {
            child.userData = { islandId: isl.id };
            islandMeshes.push(child);
          }
        });
        group.add(monumentGroup);
        group.userData.monument = monumentGroup;

        // Add subtle trees/crystals around platform
        for (let i = 0; i < 3; i++) {
          const angle = (i * Math.PI * 2) / 3 + 0.4;
          const crystalGeo = new THREE.OctahedronGeometry(0.65, 0);
          const crystalMat = new THREE.MeshStandardMaterial({
            color: themeColor,
            emissive: themeColor,
            emissiveIntensity: 0.4,
            flatShading: true
          });
          const crystal = new THREE.Mesh(crystalGeo, crystalMat);
          crystal.position.set(Math.cos(angle) * 5.2, 1.3, Math.sin(angle) * 5.2);
          crystal.scale.y = 1.6;
          group.add(crystal);
        }

        scene.add(group);
        islandGroups[isl.id] = group;
        animatedObjects.push({ group, monument: monumentGroup, baseY: isl.position.y, phase: isl.id * 0.7 });
      });
    }

      if (id === 1) {
        // Island 1: AI Robot Head + Ethics Shield
        const body = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.8, 2.2, 8), matWhite);

        head.position.y = 3.3;
        const visor = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.8, 0.2), matPrimary);
        visor.position.set(0, 3.3, 1.0);
        const shield = new THREE.Mesh(new THREE.CylinderGeometry(1.3, 0.8, 0.3, 6), matPrimary);
        shield.rotation.x = Math.PI / 2;
        shield.position.set(1.8, 2.0, 1.2);
        mGroup.add(body, head, visor, shield);
      } else if (id === 2) {
        // Island 2: Logo Geometric Monoliths (Circle, Triangle, Square)
        const box = new THREE.Mesh(new THREE.BoxGeometry(1.8, 1.8, 1.8), matPrimary);
        box.position.set(-1.6, 1.2, 0);
        const cone = new THREE.Mesh(new THREE.ConeGeometry(1.3, 2.5, 4), matGold);
        cone.position.set(1.6, 1.5, 0);
        const torus = new THREE.Mesh(new THREE.TorusGeometry(1.4, 0.4, 12, 24), matWhite);
        torus.position.set(0, 3.6, 0);
        mGroup.add(box, cone, torus);
      } else if (id === 3) {
        // Island 3: Color Wheel Prism & 3x3 Composition Frame
        const prism = new THREE.Mesh(new THREE.ConeGeometry(1.8, 3.6, 3), matPrimary);
        prism.position.y = 2.0;
        const ring = new THREE.Mesh(new THREE.TorusGeometry(2.8, 0.22, 8, 24), matGold);
        ring.position.y = 2.4;
        mGroup.add(prism, ring);
      } else if (id === 4) {
        // Island 4: 3D Rising Bar Charts & Pie Ring
        const b1 = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.8, 1.1), matWhite);
        b1.position.set(-1.8, 0.9, 0);
        const b2 = new THREE.Mesh(new THREE.BoxGeometry(1.1, 3.0, 1.1), matPrimary);
        b2.position.set(0, 1.5, 0);
        const b3 = new THREE.Mesh(new THREE.BoxGeometry(1.1, 4.4, 1.1), matGold);
        b3.position.set(1.8, 2.2, 0);

    function buildConnectingBridges() {
      for (let i = 0; i < ISLANDS_DATA.length - 1; i++) {
        const p1 = ISLANDS_DATA[i].position;
        const p2 = ISLANDS_DATA[i + 1].position;

        const start = new THREE.Vector3(p1.x, p1.y + 0.5, p1.z);
        const end = new THREE.Vector3(p2.x, p2.y + 0.5, p2.z);
        const mid = new THREE.Vector3().addVectors(start, end).multiplyScalar(0.5);
        mid.y += 3.2; // arch height

        const curve = new THREE.QuadraticBezierCurve3(start, mid, end);
        const tubeGeo = new THREE.TubeGeometry(curve, 24, 0.18, 8, false);
        const tubeMat = new THREE.MeshBasicMaterial({
          color: 0x6366f1,
          transparent: true,
          opacity: 0.45
        });
        const bridge = new THREE.Mesh(tubeGeo, tubeMat);
        scene.add(bridge);
      }
    }

    /********************************************************************
     * 5. CAMERA INTERACTION & ANIMATION LOOP
     ********************************************************************/
    function setupInteractionEvents(domElement) {
      let pointerDownPos = { x: 0, y: 0 };

      domElement.addEventListener('pointerdown', (e) => {
        camControl.isDragging = true;
        camControl.prevX = e.clientX;
        camControl.prevY = e.clientY;
        pointerDownPos = { x: e.clientX, y: e.clientY };
      });

      window.addEventListener('pointermove', (e) => {
        if (!camControl.isDragging) return;
        const dx = e.clientX - camControl.prevX;
        const dy = e.clientY - camControl.prevY;
        camControl.prevX = e.clientX;
        camControl.prevY = e.clientY;

        camControl.targetSpherical.theta -= dx * 0.006;
        camControl.targetSpherical.phi = Math.max(
          0.25,
          Math.min(Math.PI / 2.2, camControl.targetSpherical.phi - dy * 0.006)
        );
      });

      window.addEventListener('pointerup', (e) => {
        if (!camControl.isDragging) return;
        camControl.isDragging = false;
        const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
        if (dist < 6) {
          handleCanvasClick(e);
        }
      });

      window.addEventListener('pointercancel', () => { camControl.isDragging = false; });
      domElement.style.touchAction = 'none';
      domElement.addEventListener('wheel', (e) => {
        e.preventDefault();
        camControl.targetSpherical.radius = Math.max(
          22,
          Math.min(135, camControl.targetSpherical.radius + e.deltaY * 0.05)
        );
      }, { passive: false });
    }

    function handleCanvasClick(e) {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(islandMeshes, true);
      if (intersects.length > 0) {
        const hitId = intersects[0].object.userData.islandId;
        if (hitId) {
          selectIsland(hitId);
        }
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    let clock = new THREE.Clock();

    function animateScene() {
      requestAnimationFrame(animateScene);
      if (document.hidden) return;
      const elapsed = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : clock.getElapsedTime();

      // 1. Animate Ocean Waves
      if (oceanMesh) {
        const pos = oceanMesh.geometry.attributes.position;
        const base = oceanMesh.geometry.userData.baseHeights;
        for (let i = 0; i < pos.count; i++) {
          const x = pos.getX(i);
          const z = pos.getZ(i);
          const wave = Math.sin(x * 0.08 + elapsed * 1.4) * 0.45 + Math.cos(z * 0.08 + elapsed * 1.1) * 0.45;
          pos.setY(i, base[i] + wave);
        }
        pos.needsUpdate = true;
      }

      // 2. Bobbing Islands & Rotating Monuments
      animatedObjects.forEach((item) => {
        item.group.position.y = item.baseY + Math.sin(elapsed * 1.5 + item.phase) * 0.45;
        item.monument.rotation.y = elapsed * 0.55 + item.phase;
      });

      // 3. Slowly rotate data particles
      if (particleSystem) {
        particleSystem.rotation.y = elapsed * 0.03;
      }

      // 4. Smoothly interpolate Camera Position & Target
      camControl.spherical.radius += (camControl.targetSpherical.radius - camControl.spherical.radius) * 0.08;
      camControl.spherical.phi += (camControl.targetSpherical.phi - camControl.spherical.phi) * 0.08;
      camControl.spherical.theta += (camControl.targetSpherical.theta - camControl.spherical.theta) * 0.08;
      camControl.lookAtPos.lerp(camControl.targetLookAt, 0.08);

      const r = camControl.spherical.radius;
      const phi = camControl.spherical.phi;
      const theta = camControl.spherical.theta;

      camera.position.x = camControl.lookAtPos.x + r * Math.sin(phi) * Math.sin(theta);
      camera.position.y = camControl.lookAtPos.y + r * Math.cos(phi);
      camera.position.z = camControl.lookAtPos.z + r * Math.sin(phi) * Math.cos(theta);
      camera.lookAt(camControl.lookAtPos);

      // 5. Project 3D Island Positions to 2D Screen Labels
      updateHtmlLabels();

      renderer.render(scene, camera);
    }

    function updateHtmlLabels() {
      const tempV = new THREE.Vector3();
      ISLANDS_DATA.forEach((isl) => {
        const grp = islandGroups[isl.id];
        const el = labelElements[isl.id];
        if (!grp || !el) return;

        tempV.copy(grp.position);
        tempV.y += 7.2; // above monument
        tempV.project(camera);

        // Check if behind camera
        if (tempV.z > 1) {
          el.style.opacity = '0';
          el.style.pointerEvents = 'none';
          return;
        }

        const x = (tempV.x * 0.5 + 0.5) * window.innerWidth;
        const y = (-(tempV.y * 0.5) + 0.5) * window.innerHeight;

        el.style.left = `${x}px`;
        el.style.top = `${y}px`;
        el.style.opacity = '1';
        el.style.pointerEvents = 'auto';
      });
    }

    /********************************************************************
     * 6. ISLAND SELECTION, CAMERA FLY-TO & DRAWER RENDERING
     ********************************************************************/
    function selectIsland(id) {
      const island = ISLANDS_DATA.find((x) => x.id === id);
      if (!island) return;

      state.activeIslandId = id;
      state.activeSubUnitIdx = 0;

      // Fly camera to focus on the selected island
      // Offset lookAt slightly on desktop so island is visible on the left of the drawer
      const isDesktop = window.innerWidth >= 768;
      camControl.targetLookAt.set(
        island.position.x + (isDesktop ? 8 : 0),
        island.position.y + 2,
        island.position.z
      );
      camControl.targetSpherical.radius = 34;
      camControl.targetSpherical.phi = Math.PI / 3.2;

      // Open Drawer
      const drawer = document.getElementById('island-drawer');
      drawer.classList.remove('translate-x-full');

      renderDrawerHeader(island);
      renderDrawerBody(island);
      renderBottomDock();
    }

    function closeIslandDrawer() {
      state.activeIslandId = null;
      const drawer = document.getElementById('island-drawer');
      drawer.classList.add('translate-x-full');
      renderBottomDock();
    }

    function resetCameraOverview() {
      stopAutoTour();
      closeIslandDrawer();
      camControl.targetLookAt.set(0, 4, 0);
      camControl.targetSpherical.radius = 85;
      camControl.targetSpherical.phi = Math.PI / 3.1;
    }

      const current = state.activeIslandId || 1;
      let next = current + dir;
      if (next < 1) next = ISLANDS_DATA.length;
      if (next > ISLANDS_DATA.length) next = 1;
      selectIsland(next);

        document.getElementById('btn-auto-tour').classList.add('bg-cyan-500/30', 'border-cyan-400');
        state.autoTourIdx = (state.activeIslandId ? state.activeIslandId - 1 : 0);
        selectIsland(ISLANDS_DATA[state.autoTourIdx].id);
        state.autoTourTimer = setInterval(() => {
          state.autoTourIdx = (state.autoTourIdx + 1) % ISLANDS_DATA.length;
          selectIsland(ISLANDS_DATA[state.autoTourIdx].id);

              ${[
                { key: 'title', label: '1. 修正主標題（短、準、明確）', sub: '將模糊標題改為 12 字內具體主題' },
                { key: 'contrast', label: '2. 強化色彩對比（避免亮底淺字）', sub: '修正刺眼撞色，建立深淺高對比' },
                { key: 'hierarchy', label: '3. 刪減冗長文字與重整層級', sub: '長段改為動詞開頭短句，創造留白' },
                { key: 'icons', label: '4. 統一圖示風格（Icon 一致性）', sub: '替換雜亂符號，統一使用簡潔圖示' },
                { key: 'source', label: '5. 補上可追溯之引用來源與單位', sub: '拒寫「網路資料」，標明機構與年份' },
                { key: 'cta', label: '6. 加入具體可執行的行動提示 (CTA)', sub: '將「請多思考」改為具體生活任務' }
              ].map((item) => `
                <button onclick="toggleCardFix('${item.key}')"
                  class="w-full p-2.5 rounded-xl border text-left transition-all flex items-center justify-between gap-2 ${
                    fixes[item.key]
                      ? 'bg-emerald-950/50 border-emerald-500/50 text-emerald-200'
                      : 'bg-slate-900/80 border-slate-800 hover:border-slate-700 text-slate-300'
                  }">
                  <div>
                    <div class="text-xs font-black">${item.label}</div>
                    <div class="text-[11px] opacity-75">${item.sub}</div>
                  </div>
                  <div class="w-6 h-6 rounded-lg flex items-center justify-center shrink-0 ${fixes[item.key] ? 'bg-emerald-500 text-white' : 'bg-slate-800 text-slate-500'}">
                    <i class="fa-solid ${fixes[item.key] ? 'fa-check' : 'fa-wrench'} text-xs"></i>
                  </div>
                </button>
              `).join('')}
            </div>

            <!-- Right Live Simulated Card Preview -->
            <div class="lg:col-span-7">
              <div class="rounded-2xl p-5 border-2 transition-all duration-300 ${
                fixes.contrast
                  ? 'bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 border-indigo-400/60 text-white shadow-xl'
                  : 'bg-yellow-200 border-red-400 text-yellow-600'
              }">
                <!-- Top Badge -->
                <div class="flex items-center justify-between text-[11px] font-bold mb-2">
                  <span class="${fixes.contrast ? 'px-2.5 py-0.5 rounded-full bg-cyan-500/20 text-cyan-300' : 'text-yellow-500'}">
                    校園永續生活知識卡
                  </span>
                  <span class="px-2 py-0.5 rounded font-black ${score === 100 ? 'bg-emerald-500 text-white' : 'bg-rose-500 text-white'}">
                    ${score === 100 ? '✔ 完美定稿 V3' : '⚠ 待修正初稿 V1'}
                  </span>
                </div>

                <!-- 1. Main Title & 2. Subtitle -->
                <div class="mb-3">
                  <h4 class="${fixes.title ? 'text-xl sm:text-2xl font-black tracking-tight' : 'text-sm font-normal underline'} ${fixes.contrast ? 'text-white' : 'text-yellow-500'}">
                    ${fixes.title ? '校園減塑的 3 個實用習慣' : '關於一些大家在學校裡非常重要而且一定要知道的事情分享'}
                  </h4>
                  <p class="text-xs mt-1 ${fixes.contrast ? 'text-indigo-200' : 'text-yellow-500'}">
                    ${fixes.title ? '從日常飲水、餐盒使用與自備提袋開始改變生態' : '這是一張講述很多事情的圖卡希望大家喜歡'}
                  </p>
                </div>

                <!-- 3. Key Sentence -->
                <div class="p-2.5 rounded-xl mb-3 text-xs font-bold ${
                  fixes.contrast
                    ? 'bg-indigo-500/25 border border-indigo-400/40 text-amber-300'
                    : 'bg-yellow-100 border border-yellow-300 text-yellow-500'
                }">
                  <i class="fa-solid fa-lightbulb mr-1"></i>重點句：每天少用一個一次性塑膠袋，每年可為海洋減少數百件塑膠垃圾！
                </div>

                <!-- 4. Body Points & Icons -->
                <div class="space-y-2 mb-4">
                  ${fixes.hierarchy ? `
                    <div class="flex items-center gap-2.5 p-2 rounded-lg ${fixes.contrast ? 'bg-slate-800/70' : 'bg-yellow-100'}">
                      <span class="w-7 h-7 rounded-lg bg-cyan-500/20 text-cyan-300 flex items-center justify-center shrink-0">
                        <i class="fa-solid ${fixes.icons ? 'fa-bottle-water' : 'fa-ghost'}"></i>
                      </span>
                      <span class="text-xs font-bold">1. 自備環保水杯：減少購買瓶裝水與手搖飲塑膠杯（占比達 42%）。</span>
                    </div>
                    <div class="flex items-center gap-2.5 p-2 rounded-lg ${fixes.contrast ? 'bg-slate-800/70' : 'bg-yellow-100'}">
                      <span class="w-7 h-7 rounded-lg bg-cyan-500/20 text-cyan-300 flex items-center justify-center shrink-0">
                        <i class="fa-solid ${fixes.icons ? 'fa-utensils' : 'fa-Snowman'}"></i>
                      </span>
                      <span class="text-xs font-bold">2. 使用重複餐具：外帶午餐自備不鏽鋼便當盒與環保筷。</span>
                    </div>
                    <div class="flex items-center gap-2.5 p-2 rounded-lg ${fixes.contrast ? 'bg-slate-800/70' : 'bg-yellow-100'}">
                      <span class="w-7 h-7 rounded-lg bg-cyan-500/20 text-cyan-300 flex items-center justify-center shrink-0">
                        <i class="fa-solid ${fixes.icons ? 'fa-bag-shopping' : 'fa-jet-fighter'}"></i>
                      </span>
                      <span class="text-xs font-bold">3. 拒絕過度包裝：隨身攜帶摺疊環保袋，落實源頭減量。</span>
                    </div>
                  ` : `
                    <p class="text-[11px] leading-tight">
                      我們在學校裡面每天都會買很多飲料跟便當，然後就會產生非常非常多的塑膠垃圾，像是塑膠袋啊、吸管啊、免洗筷跟飲料杯（約42），如果不去處理的話海洋裡面的海龜就會吃到塑膠袋非常可憐，所以我們應該要試著帶環保杯跟環保餐具去買飯，不要再用那麼多塑膠製品了喔！
                    </p>
                  `}
                </div>

                <!-- 5. Source & 6. CTA -->
                <div class="pt-2.5 border-t ${fixes.contrast ? 'border-slate-700/80' : 'border-yellow-300'} flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-[11px]">
                  <div class="${fixes.contrast ? 'text-slate-400' : 'text-yellow-500'}">
                    <i class="fa-solid fa-link mr-1"></i>${fixes.source ? '資料來源：環境部資源循環署 (2025) 校園減塑統計報告' : '資料來源：網路資料'}
                  </div>
                  <div class="px-2.5 py-1 rounded-lg font-black ${
                    fixes.cta
                      ? 'bg-emerald-500 text-slate-950'
                      : 'bg-yellow-300 text-yellow-600'
                  }">
                    <i class="fa-solid fa-person-running mr-1"></i>${fixes.cta ? '行動提示：記錄你今天少用了幾個塑膠袋！' : '行動提示：請大家多多思考！'}
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function toggleCardFix(key) {
      state.cardInspectorFixes[key] = !state.cardInspectorFixes[key];
      if (state.cardInspectorFixes[key]) {
        awardXP(20, "完成一項人工精修！", "落實完稿前品質把關");
      }
      refreshActiveLabViews();
    }

    function refreshActiveLabViews() {
      const island = ISLANDS_DATA.find((x) => x.id === state.activeIslandId);
      if (island && state.activeDrawerTab === 'lab') {
        renderDrawerBody(island);
      }
      const modal = document.getElementById('global-lab-modal');
      if (!modal.classList.contains('hidden')) {
        switchGlobalLabTab(currentGlobalLabTab);
      }
    }

    /********************************************************************
     * 8. ISLAND CHALLENGE QUIZ & MASTERY SYSTEM
     ********************************************************************/
    function renderQuizInsideContainer(container, island) {
      const allAnsweredCorrect = island.quiz.every(
        (q, idx) => state.quizAnswers[`${island.id}-${idx}`] === q.ans
      );

      container.innerHTML = `
        <div class="space-y-4">
          <div class="p-4 rounded-2xl bg-gradient-to-r from-indigo-950/90 to-purple-950/80 border border-indigo-500/40 flex items-center justify-between">
            <div>
              <span class="text-xs font-black text-amber-300 uppercase"><i class="fa-solid fa-trophy mr-1"></i>島嶼認證挑戰</span>
              <h3 class="text-base sm:text-lg font-black text-white mt-0.5">${island.name}｜實戰觀念測驗</h3>
              <p class="text-xs text-slate-300 mt-0.5">全部答對即可點亮本島嶼徽章並獲得 +150 XP 獎勵！</p>
            </div>
            ${allAnsweredCorrect ? `
              <div class="px-3 py-1.5 rounded-xl bg-emerald-500/20 border border-emerald-400 text-emerald-300 text-xs font-black shrink-0">
                <i class="fa-solid fa-medal mr-1"></i>已通關！
              </div>
            ` : ''}
          </div>

          ${island.quiz.map((qItem, qIdx) => {
            const key = `${island.id}-${qIdx}`;
            const chosen = state.quizAnswers[key];
            const isAnswered = chosen !== undefined;
            const isCorrect = chosen === qItem.ans;

            return `
              <div class="p-4 sm:p-5 rounded-2xl bg-slate-900/85 border border-slate-800 space-y-3">
                <div class="text-xs font-black text-indigo-400">問題 0${qIdx + 1}</div>
                <h4 class="text-sm sm:text-base font-bold text-white leading-snug">${qItem.q}</h4>
                <div class="space-y-2 pt-1">
                  ${qItem.options.map((opt, oIdx) => {
                    let btnStyle = 'bg-slate-950/80 border-slate-800 hover:border-indigo-400 text-slate-200';
                    if (isAnswered) {
                      if (oIdx === qItem.ans) {
                        btnStyle = 'bg-emerald-950/70 border-emerald-500 text-emerald-200 font-bold';
                      } else if (oIdx === chosen && !isCorrect) {
                        btnStyle = 'bg-rose-950/70 border-rose-500 text-rose-200';
                      }
                    }
                    return `
                      <button onclick="submitQuizAnswer(${island.id}, ${qIdx}, ${oIdx})"
                        class="w-full p-3 rounded-xl border text-left text-xs sm:text-sm transition-all flex items-start gap-2.5 ${btnStyle}">
                        <span class="w-5 h-5 rounded-md bg-slate-800 text-slate-300 flex items-center justify-center text-xs font-black shrink-0 mt-0.5">
                          ${['A', 'B', 'C', 'D'][oIdx]}
                        </span>
                        <span class="flex-1">${opt}</span>
                      </button>
                    `;
                  }).join('')}
                </div>

                ${isAnswered ? `
                  <div class="p-3.5 rounded-xl text-xs sm:text-sm leading-relaxed ${
                    isCorrect
                      ? 'bg-emerald-950/40 border border-emerald-500/40 text-emerald-200'
                      : 'bg-rose-950/40 border border-rose-500/40 text-rose-200'
                  }">
                    <div class="font-black mb-1">
                      <i class="fa-solid ${isCorrect ? 'fa-circle-check text-emerald-400' : 'fa-circle-xmark text-rose-400'} mr-1"></i>
                      ${isCorrect ? '回答正確！' : '這題再看一次解析，點擊正確選項即可完成訂正：'}
                    </div>
                    <div>${qItem.exp}</div>
                  </div>
                ` : ''}
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function submitQuizAnswer(islandId, qIdx, optionIdx) {
      const island = ISLANDS_DATA.find((x) => x.id === islandId);
      if (!island) return;

      const key = `${islandId}-${qIdx}`;
      state.quizAnswers[key] = optionIdx;

      if (optionIdx === island.quiz[qIdx].ans) {
        awardXP(50, "測驗答對！", `完成第 ${islandId} 島第 ${qIdx + 1} 題`);
      }

      // Check if all questions on this island are answered correctly
      const allCorrect = island.quiz.every(
        (q, i) => state.quizAnswers[`${islandId}-${i}`] === q.ans
      );

      if (allCorrect && !state.masteredIslands.has(islandId)) {
        state.masteredIslands.add(islandId);
        awardXP(150, `恭喜精通「${island.name}」！`, "已點亮島嶼完成徽章");
        updateIslandMasteryVisuals(islandId);
        renderDrawerHeader(island);
        renderBottomDock();
      }

      renderDrawerBody(island);
    }

    function updateIslandMasteryVisuals(islandId) {
      // Update 3D ring glow to bright emerald/gold
      const grp = islandGroups[islandId];
      if (grp && grp.userData.ringMesh) {
        grp.userData.ringMesh.material.color.setHex(0x34d399);
        grp.userData.ringMesh.material.opacity = 0.9;
      }
      // Show checkmark on floating 3D HTML label
      const checkIcon = document.getElementById(`label-check-${islandId}`);
      if (checkIcon) checkIcon.classList.remove('hidden');

      // Update top HUD mastery bar
      const count = state.masteredIslands.size;
      document.getElementById('mastery-counter').textContent = `${count} / ${ISLANDS_DATA.length} 島`;
      document.getElementById('mastery-bar').style.width = `${(count / ISLANDS_DATA.length) * 100}%`;
    }

    function awardXP(amount, title, desc) {
      state.xp += amount;
      document.getElementById('xp-counter').textContent = `${state.xp} XP`;
      showToast(title, `+${amount} XP｜${desc}`);
    }

    let toastTimeout;
    function showToast(title, desc) {
      const box = document.getElementById('toast-box');
      document.getElementById('toast-title').textContent = title;
      document.getElementById('toast-desc').textContent = desc;
      box.classList.remove('translate-x-[150%]');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        box.classList.add('translate-x-[150%]');
      }, 3000);
    }

    /********************************************************************
     * 9. GLOBAL WORKSHOP MODAL CONTROLS
     ********************************************************************/
    let currentGlobalLabTab = 'prompt';

    function openGlobalLabModal() {
      stopAutoTour();
      const modal = document.getElementById('global-lab-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      switchGlobalLabTab(currentGlobalLabTab);
    }

    function closeGlobalLabModal() {
      const modal = document.getElementById('global-lab-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function switchGlobalLabTab(tab) {
      currentGlobalLabTab = tab;
      ['prompt', 'chart', 'inspector'].forEach((t) => {
        const btn = document.getElementById(`glab-tab-${t}`);
        if (t === tab) {
          btn.className = 'px-4 py-2.5 rounded-t-xl font-bold text-xs sm:text-sm border-b-2 border-indigo-400 text-indigo-300 bg-slate-800/80 flex items-center gap-2 shrink-0';
        } else {
          btn.className = 'px-4 py-2.5 rounded-t-xl font-bold text-xs sm:text-sm border-b-2 border-transparent text-slate-400 hover:text-slate-200 flex items-center gap-2 shrink-0';
        }
      });
      const body = document.getElementById('global-lab-body');
      renderMiniLabInsideContainer(body, tab);
    }

    /********************************************************************
     * 10. INITIALIZE ON WINDOW LOAD
     ********************************************************************/
    window.onload = function () {
      renderBottomDock();
      initThreeScene();
    };
  </script>
<dialog id="passport" class="glass-panel"><div class="passport-heading"><h2><i class="fa-solid fa-address-book"></i> 學習護照</h2><button onclick="document.getElementById('passport').close()" class="glass-pill" aria-label="關閉學習護照">關閉 ✕</button></div><div id="passport-content"></div></dialog>
<script src="./assets/supplement.js"></script><script src="./assets/enhance.js"></script>
</body>
</html>
